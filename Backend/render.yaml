services:
  - type: web
    name: ncc-ai-trainer-backend
    env: python
    region: singapore
    buildCommand: "pip install -r Backend/requirements.txt"
    startCommand: "cd Backend && gunicorn app:app"
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ncc-ai-trainer-frontend
    env: node
    region: singapore
    buildCommand: "cd Frontend && npm install && npm run build"
    startCommand: "npx serve -s dist -l 3000"
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: 18.x